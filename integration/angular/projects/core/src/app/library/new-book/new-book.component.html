@if (authorsQuery.loading()) { Loading... }
@if (authorsQuery.error(); as error) { {{ error.message }} }
@if (authorsQuery.data()?.authors; as authors) {
<form class="form" [formRoot]="form" autocomplete="off">
  @for (error of form().errors(); track error) {
  <div class="error-well">An error has occurred: {{ error.message }}</div>
  }
  <label class="form-field">
    <span>Name *</span>
    <input type="text" [formField]="form.name" />
  </label>
  <label class="form-field">
    <span>Genre</span>
    <input type="text" [formField]="form.genre" />
  </label>
  <label class="form-field">
    <span>Author *</span>
    <select [formField]="form.authorId">
      @for (author of authors; track author.id) {
      <option [value]="author.id">{{ author.name }}</option>
      }
    </select>
  </label>
  <div class="form-buttons">
    <button type="submit" [disabled]="form().submitting()">Submit</button>
    <button type="button" (click)="closed.emit()">Close</button>
  </div>
</form>
}
